services:
  migrate:
    build: .
    command: alembic upgrade head
    restart: "no"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    ports: ["127.0.0.1:8080:8080"]
    volumes: [clips:/data]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
  worker:
    build: .
    command: celery -A cliprush.tasks.celery_app worker --loglevel=info --concurrency=2
    restart: unless-stopped
    env_file: .env
    volumes: [clips:/data]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
  beat:
    build: .
    command: celery -A cliprush.tasks.celery_app beat --loglevel=info
    restart: unless-stopped
    env_file: .env
    volumes: [clips:/data]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
  scout:
    build: .
    command: python -m cliprush.live
    restart: unless-stopped
    env_file: .env
    volumes: [clips:/data]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
  backup:
    image: postgres:16-alpine
    profiles: ["ops"]
    restart: "no"
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: cliprush
      PGDATABASE: cliprush
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - backups:/backups
      - ./ops/backup.sh:/opt/cliprush-backup.sh:ro
    command: ["sh", "/opt/cliprush-backup.sh"]
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cliprush
      POSTGRES_DB: cliprush
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cliprush"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
volumes:
  pgdata:
  clips:
  backups:
