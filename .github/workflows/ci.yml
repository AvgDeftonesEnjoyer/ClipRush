name: Tests
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: cp .env.example .env && docker compose config -q
      - run: CLIPRUSH_DOMAIN=example.test docker compose -f docker-compose.yml -f docker-compose.edge.yml config -q
      - run: DATABASE_URL=sqlite:////tmp/cliprush-schema-ci.db alembic upgrade head
      - run: DATABASE_URL=sqlite:////tmp/cliprush-schema-ci.db alembic current
      - run: python -m compileall -q cliprush
      - run: python -m pytest -q
